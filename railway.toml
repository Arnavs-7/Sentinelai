# Railway deployment configuration for the SentinelAI API service.
# The dashboard is deployed separately on Streamlit Cloud.

[build]
builder = "nixpacks"

[deploy]
startCommand = "python setup_models.py && uvicorn api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
