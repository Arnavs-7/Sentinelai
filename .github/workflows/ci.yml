name: CI

# Lints and tests every push and pull request to main. Render auto-deploys
# on push to main; this pipeline gates that deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install ruff pytest-cov

      - name: Lint with ruff
        run: ruff check api src dashboard tests

      - name: Run tests with coverage
        run: >
          pytest -p no:warnings
          --cov=api --cov=src
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
